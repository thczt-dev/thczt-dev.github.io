  <rect x="210" y="178" width="68" height="54" rx="6" fill="#141416" stroke="url(#cromo)" stroke-width="2"/>
  <g stroke="#5d6469" stroke-width="1.5"><path d="M216 188h56M216 196h56M216 204h56M216 212h56M216 220h56"/></g>
  <circle cx="244" cy="205" r="12" fill="#0b0b0c" stroke="#9aa2a8" stroke-width="2"/>

