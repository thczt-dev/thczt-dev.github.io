    <path d="M372 214 410 214M372 214 399 177M372 214 372 176M372 214 345 177M372 214 334 214M372 214 345 251M372 214 372 252M372 214 399 251"/>
  </g>
  <g fill="#17171a" stroke="#b8893f" stroke-width="2">
    <circle cx="112" cy="214" r="11"/><circle cx="372" cy="214" r="11"/>
  </g>

