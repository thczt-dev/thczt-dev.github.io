    <circle cx="112" cy="214" r="38" stroke="#2a2a2d" stroke-width="6"/>
    <circle cx="372" cy="214" r="60" stroke="#0d0d0f" stroke-width="16"/>
    <circle cx="372" cy="214" r="50" stroke="url(#cromo)" stroke-width="2.5" opacity=".75"/>
