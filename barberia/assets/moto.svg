<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Moto café racer de perfil">
  <defs>
    <linearGradient id="tanque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3b3e"/><stop offset=".45" stop-color="#171719"/><stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="cromo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5dbdf"/><stop offset=".5" stop-color="#697177"/><stop offset="1" stop-color="#2b2f32"/>
    </linearGradient>
    <radialGradient id="farola"><stop offset="0" stop-color="#f4e2b8"/><stop offset=".6" stop-color="#b8893f"/><stop offset="1" stop-color="#3a2b16"/></radialGradient>
    <radialGradient id="vigneta"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
  </defs>

  <rect width="480" height="320" fill="#080809"/>
